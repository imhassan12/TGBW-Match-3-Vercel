<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Unity WebGL Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Unity container -->
  <div id="unity-container">
    <div id="loading-screen">
      <div class="spinner"></div>
      <div id="loading-text">Loading...</div>
    </div>
    <div id="canvas-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      devicePixelRatio: window.devicePixelRatio || 1
    };

    var canvas = document.querySelector("#unity-canvas");
    var loadingScreen = document.querySelector("#loading-screen");
    var unityInstance = null;

    //  Orientation logic
    function GetScreenOrientation() {
      return (window.innerHeight > window.innerWidth) ? "Portrait" : "Landscape";
    }

    function NotifyOrientationChange() {
      if (unityInstance && unityInstance.SendMessage) {
        var orientation = GetScreenOrientation();
        unityInstance.SendMessage('DeviceOrientationHandler', 'OnJSOrientationChange', orientation);
        console.log("Orientation sent to Unity:", orientation);
      } else {
        console.warn("Unity not ready yet.");
      }
    }

    // Load Unity
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#loading-text").textContent = `Loading... ${(progress * 100).toFixed(0)}%`;
      }).then((instance) => {
        unityInstance = instance;
        loadingScreen.style.display = "none";

        // Immediately send orientation once Unity is ready
        NotifyOrientationChange();

        // Optional fullscreen for mobile
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          canvas.requestFullscreen = canvas.requestFullscreen || canvas.mozRequestFullScreen || canvas.msRequestFullscreen || canvas.webkitRequestFullscreen;
          if (canvas.requestFullscreen) {
            canvas.requestFullscreen().catch(err => console.log("Fullscreen request failed:", err));
            document.addEventListener('click', () => {
              if (canvas.requestFullscreen) {
                canvas.requestFullscreen().catch(() => {});
              }
            }, { once: true });
          }
        }
      }).catch((error) => {
        alert("Error loading game: " + error);
      });
    };
    document.body.appendChild(script);

    //  Detect when user rotates or resizes screen
    window.addEventListener("resize", NotifyOrientationChange);
    window.addEventListener("orientationchange", NotifyOrientationChange);
  </script>
</body>
</html>
