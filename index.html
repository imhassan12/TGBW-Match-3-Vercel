<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Unity WebGL Game</title>

  <!--  Embedded responsive CSS -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      touch-action: none;
      background: black;
    }

    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    #unity-canvas {
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      background: #000;
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      z-index: 10;
    }

    .spinner {
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top: 5px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <div id="loading-screen">
      <div class="spinner"></div>
      <div id="loading-text">Loading...</div>
    </div>
    <div id="canvas-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/TGBW-Match-3-Vercel.loader.js";
    var config = {
      dataUrl: buildUrl + "/TGBW-Match-3-Vercel.data",
      frameworkUrl: buildUrl + "/TGBW-Match-3-Vercel.framework.js",
      codeUrl: buildUrl + "/TGBW-Match-3-Vercel.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Mango Mango",
      productName: "TGBW Tiger Woods",
      productVersion: "1.6.8",
      devicePixelRatio: window.devicePixelRatio || 1
    };

    var canvas = document.querySelector("#unity-canvas");
    var loadingScreen = document.querySelector("#loading-screen");
    var unityInstance = null;

    //  Orientation detection
    function GetScreenOrientation() {
      return (window.innerHeight > window.innerWidth) ? "Portrait" : "Landscape";
    }

    function NotifyOrientationChange() {
      if (unityInstance && unityInstance.SendMessage) {
        var orientation = GetScreenOrientation();
        unityInstance.SendMessage('DeviceOrientationHandler', 'OnJSOrientationChange', orientation);
        console.log("Orientation sent to Unity:", orientation);
      } else {
        console.warn("Unity not ready yet.");
      }
    }

    // Load Unity
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#loading-text").textContent = `Loading... ${(progress * 100).toFixed(0)}%`;
      }).then((instance) => {
        unityInstance = instance;
        loadingScreen.style.display = "none";

        //  Delay call so Unity GameObjects are ready
        setTimeout(NotifyOrientationChange, 100);

        // Optional fullscreen for mobile
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          canvas.requestFullscreen = canvas.requestFullscreen || canvas.mozRequestFullScreen || canvas.msRequestFullscreen || canvas.webkitRequestFullscreen;
          if (canvas.requestFullscreen) {
            canvas.requestFullscreen().catch(err => console.log("Fullscreen request failed:", err));
            document.addEventListener('click', () => {
              if (canvas.requestFullscreen) {
                canvas.requestFullscreen().catch(() => {});
              }
            }, { once: true });
          }
        }
      }).catch((error) => {
        alert("Error loading game: " + error);
      });
    };
    document.body.appendChild(script);

    //  Update orientation on resize/rotate
    window.addEventListener("resize", NotifyOrientationChange);
    window.addEventListener("orientationchange", NotifyOrientationChange);
  </script>
</body>
</html>
